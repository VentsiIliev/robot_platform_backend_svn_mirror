# Platform development checks. Runtime dependencies belong to requirements.txt.
# Keep the initial check scope limited to paint-head detection.
[tool.mypy]
strict = true
follow_imports = "skip"
files = ["src/robot_systems/paint/paint_head_detection"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "src/robot_systems/paint/paint_head_detection/**/*.py",
    "tests/robot_systems/paint/paint_head_detection/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]
