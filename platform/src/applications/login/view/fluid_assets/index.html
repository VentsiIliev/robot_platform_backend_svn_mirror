<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
.decoration{position:fixed;display:none;pointer-events:none;object-fit:contain;z-index:1}
#fluid{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;mix-blend-mode:multiply}
</style></head><body>
<img class="decoration" id="logo" alt=""><img class="decoration" id="machine" alt="">
<canvas id="fluid"></canvas>
<script>
window.setDecorations = function(data) {
  for (const name of ['logo','machine']) {
    const img = document.getElementById(name), d = data[name];
    if (!d || !d.visible) { img.style.display = 'none'; continue; }
    if (img.src !== d.src) img.src = d.src;
    img.style.display = 'block';
    img.style.left = d.x + 'px';
    img.style.top = d.y + 'px';
    img.style.width = d.w + 'px';
    img.style.height = d.h + 'px';
  }
};
</script>
<script src="fluid.js"></script></body></html>
