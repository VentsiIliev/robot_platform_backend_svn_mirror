    if(x.state.dirty){
      const bg=design.language==='bg';
      const m=modal(x,bg?'Незаписани промени':'Unsaved changes',bg?'Запишете или отхвърлете промените преди смяна на профила.':'Save or discard this draft before switching profiles.',function(){closeModal(x);openProfile()},t('saveDraft'));
      const discard=button(bg?'Отхвърли':'Discard','discard');
      discard.addEventListener('click',function(){closeModal(x);openProfile()});
      m.actions.insertBefore(discard,m.confirm);
      x.stage.querySelector('[data-action=profile-picker]').value=x.state.profile;
      return;
    }
    openProfile();
  }
  root.querySelectorAll('.ph-stage').forEach(function(stage){
    stage.append(document.getElementById('ph-app-template').content.cloneNode(true));
    const x={stage:stage,layout:stage.dataset.layout,state:{profile:'standard',profiles:{standard:{name:'Standard',revisions:[4,3,2]},spare:{name:'Spare head',revisions:[2,1]}},runtime:{profile:'standard',name:'Standard',rev:3},base:4,dirty:true,page:stage.dataset.layout==='guided'?'references':'regions',tool:'select',frozen:false,live:false,removed:false,notice:'',noticeError:false}};
    instances.push(x);update(x);
    stage.addEventListener('click',function(event){
      const b=event.target.closest('button');if(!b||b.closest('.ph-dialog'))return;
      const s=x.state,p=selectedProfile(x),action=b.dataset.action;
      s.returnFocus=b;
      if(b.dataset.page){s.page=b.dataset.page;s.live=false;update(x);persist();return}
      if(action==='revisions'){s.page='revisions';s.live=false;update(x)}
      if(action==='profile'){changeProfile(x,b.dataset.profile);return}
      if(action==='freeze'){s.frozen=!s.frozen;if(s.frozen)s.live=false;update(x)}
      if(action==='tool'||action==='pick-object'){s.tool=b.dataset.tool;s.frozen=true;update(x)}
      if(action==='save-draft'){s.dirty=false;update(x);notice(x,t('savedDraftNotice'))}
      if(action==='save-revision'){const rev=Math.max.apply(null,p.revisions.concat([s.base]))+1;p.revisions.unshift(rev);s.base=rev;s.dirty=false;s.page='revisions';update(x);notice(x,t('savedRevisionNotice'))}
      if(action==='remove-object'){s.removed=true;s.dirty=true;update(x);notice(x,t('removedNotice'))}
      if(action==='test'){s.frozen=true;update(x);notice(x,t('testedNotice'))}
      if(action==='live'){s.live=!s.live;s.frozen=!s.live;update(x);notice(x,t(s.live?'liveNotice':'liveStopped'))}
      if(action==='edit-revision'){s.base=Number(b.dataset.rev);s.page='regions';s.dirty=false;update(x);notice(x,t('editNotice')+' r'+s.base)}
      if(action==='apply'){s.runtime={profile:s.profile,name:p.name,rev:Number(b.dataset.rev)};update(x);notice(x,t('applyNotice')+' '+p.name+' · r'+s.runtime.rev)}
      if(action==='delete-revision'){
        if(b.dataset.blocked){notice(x,t('blocked'),true)}
        else{const rev=Number(b.dataset.rev);modal(x,t('confirmDelete')+' '+p.name+' · r'+rev,t('deleteDetail'),function(){p.revisions=p.revisions.filter(function(r){return r!==rev});closeModal(x);update(x);notice(x,t('deletedNotice'));persist()})}
      }
      if(action==='delete-profile'){
        if(s.runtime.profile===s.profile){notice(x,t('profileBlocked'),true)}
        else{modal(x,t('confirmProfile')+' '+p.name,t('deleteDetail'),function(){
          const removed=s.profile;
          delete s.profiles[removed];
          stage.querySelectorAll('[data-action=profile]').forEach(function(item){if(item.dataset.profile===removed)item.remove()});
          const picker=stage.querySelector('[data-action=profile-picker]');
          Array.from(picker.options).forEach(function(option){if(option.value===removed)option.remove()});
          s.profile=s.runtime.profile;s.base=selectedProfile(x).revisions[0]||0;s.dirty=false;
          closeModal(x);update(x);notice(x,t('profileDeleted'));persist();
        },t('deleteWhole'))}
      }
      if(action==='capture'){
        s.frozen=true;update(x);
        const m=modal(x,t('captureTitle'),t('captureDetail'),function(){s.dirty=true;closeModal(x);update(x);notice(x,t('capturedNotice'));persist()},t('captureConfirm'));
        const preview=stage.querySelector('[data-role=scene]').cloneNode(true);preview.querySelectorAll('.ph-overlay').forEach(function(e){e.remove()});
        preview.querySelector('[data-role=head-shape]').style.visibility=b.dataset.kind==='missing'?'hidden':'visible';
        const field=el('label','ph-field'),role=el('select');role.setAttribute('aria-label',t('referenceRole'));
        [['present','headPresent'],['missing','headMissing']].forEach(function(item){const option=el('option',null,t(item[1]));option.value=item[0];role.append(option)});
        role.value=b.dataset.kind;
        role.addEventListener('change',function(){preview.querySelector('[data-role=head-shape]').style.visibility=role.value==='missing'?'hidden':'visible'});
        field.append(el('span',null,t('referenceRole')),role);m.dialog.insertBefore(preview,m.actions);m.dialog.insertBefore(field,m.actions);
      }
      if(action==='new-profile'){
        const m=modal(x,t('newTitle'),t('draftPrivate'),function(){
          const name=input.value.trim();if(!name){input.focus();return}
          const id='profile'+Object.keys(s.profiles).length;s.profiles[id]={name:name,revisions:[]};
          const pick=stage.querySelector('[data-action=profile-picker]'),option=el('option',null,name);option.value=id;pick.append(option);
          const item=button(name,'profile');item.dataset.profile=id;stage.querySelector('.ph-library').insertBefore(item,stage.querySelector('.ph-add'));
          s.profile=id;s.base=0;s.dirty=true;s.page='references';closeModal(x);update(x);notice(x,t('created'));persist();
        },t('create'));
        const field=el('label','ph-field'),input=el('input');input.value=t('newName');field.append(el('span',null,t('profileName')),input);m.dialog.insertBefore(field,m.actions);input.focus();input.select();
      }
      persist();
    });
    stage.addEventListener('change',function(event){
      if(event.target.dataset.action==='profile-picker'){changeProfile(x,event.target.value);return}
      if(event.target.dataset.edit){x.state.dirty=true;update(x);persist()}
    });
    stage.addEventListener('keydown',function(e){
      const overlay=stage.querySelector('[data-role=modal]');
      if(overlay.hidden)return;
      if(e.key==='Escape'){closeModal(x);return}
      if(e.key==='Tab'){
        const nodes=Array.from(overlay.querySelectorAll('button,input,select')).filter(function(item){return !item.disabled});
        const first=nodes[0],last=nodes[nodes.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
      }
    });
    const scene=stage.querySelector('[data-role=scene]');
    let drawing=null;
    scene.addEventListener('pointerdown',function(e){
      if(x.state.page!=='regions'||x.state.tool==='select')return;
      const bounds=scene.getBoundingClientRect(),start={x:Math.max(0,(e.clientX-bounds.left)/bounds.width*100),y:Math.max(0,(e.clientY-bounds.top)/bounds.height*100)};
      const mark=el('div','ph-overlay ph-draw');mark.style.left=start.x+'%';mark.style.top=start.y+'%';scene.append(mark);drawing={start:start,mark:mark,bounds:bounds};scene.setPointerCapture(e.pointerId);
    });
    scene.addEventListener('pointermove',function(e){
      if(!drawing)return;
      const endX=Math.min(100,Math.max(0,(e.clientX-drawing.bounds.left)/drawing.bounds.width*100)),endY=Math.min(100,Math.max(0,(e.clientY-drawing.bounds.top)/drawing.bounds.height*100));
      drawing.mark.style.left=Math.min(endX,drawing.start.x)+'%';drawing.mark.style.top=Math.min(endY,drawing.start.y)+'%';drawing.mark.style.width=Math.abs(endX-drawing.start.x)+'%';drawing.mark.style.height=Math.abs(endY-drawing.start.y)+'%';
    });
    scene.addEventListener('pointerup',function(){if(!drawing)return;drawing.mark.classList.remove('ph-draw');drawing=null;x.state.dirty=true;update(x);notice(x,t('drawnNotice'));persist()});
  });
  let lastMeasuredWidth=0;
  new ResizeObserver(function(){if(root.clientWidth!==lastMeasuredWidth){lastMeasuredWidth=root.clientWidth;scheduleStageSizing()}}).observe(root);
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:function(){instances.forEach(update)}});
    tweak.addSelect(design,'language',{label:'Language',options:[{label:'Български',value:'bg'},{label:'English',value:'en'}]});
    tweak.addSelect(design,'scenario',{label:'Detection state',options:[{label:'Misaligned',value:'misaligned'},{label:'Present',value:'present'},{label:'Missing',value:'missing'},{label:'Unknown',value:'unknown'},{label:'Stale frame',value:'invalid'}]});
    tweak.addToggle(design,'showRegions',{label:'Show region overlays'});
    tweak.addSlider(design,'spacing',{label:'Panel spacing',min:8,max:18,step:2,unit:'px'});
  }
  window.addEventListener('openai:set_globals',function(e){
    const state=e.detail&&e.detail.globals&&e.detail.globals.widgetState;
    if(state&&state.privateContent&&['bg','en'].includes(state.privateContent.language)){design.language=state.privateContent.language;instances.forEach(update)}
  });
})();
</script>
