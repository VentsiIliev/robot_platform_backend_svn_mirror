# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 2000           # Hz — 500 us controller/EtherCAT cycle for collision-observer timing trials
    realtime_priority: 80     # FIFO priority for controller_manager RT thread
    use_sim_time: false
    manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    drive_enable_set_controller:
      type: forward_command_controller/ForwardCommandController
    drive_disable_set_controller:
      type: forward_command_controller/ForwardCommandController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    realtime_collision_controller:
      type: zeroerr/RealtimeCollisionController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    interfaces:
      - position
      - velocity
      - effort
      - following_error_actual
      - torque_sensor
      - motor_actual_current
      - statusword
      - error_code
      - mode_display
    publish_dynamic_joint_states: true

realtime_collision_controller:
  ros__parameters:
    joints: [Joint_1, Joint_2, Joint_3, Joint_4, Joint_5, Joint_6]
    base_link: base_link
    tip_link: tool0
    collision_config_path: ""
    observer_gain: 10.0
    filter_alpha: 0.7
    acceleration_filter_cutoff_hz: 40.0
    # Startup and every operator acknowledgement estimate a fresh stationary baseline.
    warmup_sec: 8.0
    rearm_settle_sec: 0.5
    drive_stable_sec: 2.0
    warmup_velocity_limit: 0.02
    warmup_min_samples: 20
    # Plot data is emitted from the synchronous 2 kHz controller update.
    plot_period_sec: 0.0005
    # Timing/readiness telemetry remains lightweight at 100 Hz.
    timing_period_sec: 0.01

manipulator_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolation_method: "splines"
    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: false
    open_loop_control: false
    set_last_command_interface_value_as_state_on_activation: false
    state_publish_rate: 1000.0
    action_monitor_rate: 1000.0
    # Enable trajectory point velocities for continuous motion
    command_joint_names:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    # Relaxed constraints to prevent jitter
    constraints:
      decelerate_on_cancel: false
      goal_time: 0.0
      stopped_velocity_tolerance: 0.2
      Joint_1: {trajectory: 0.0, goal: 0.1, max_deceleration_on_cancel: 0.5}
      Joint_2: {trajectory: 0.0, goal: 0.1, max_deceleration_on_cancel: 0.5}
      Joint_3: {trajectory: 0.0, goal: 0.1, max_deceleration_on_cancel: 0.5}
      Joint_4: {trajectory: 0.0, goal: 0.1, max_deceleration_on_cancel: 0.5}
      Joint_5: {trajectory: 0.0, goal: 0.1, max_deceleration_on_cancel: 0.5}
      Joint_6: {trajectory: 0.0, goal: 0.1, max_deceleration_on_cancel: 0.5}
drive_enable_set_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    interface_name: enable_set

drive_disable_set_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    interface_name: disable_set
